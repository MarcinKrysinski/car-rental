spring:
  application:
    name: car-rental
  datasource:
    # LOCK_TIMEOUT: how long a reservation waits for another one of the same car type (ms).
    url: jdbc:h2:mem:carrental;LOCK_TIMEOUT=10000
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    # initial fleet
    defer-datasource-initialization: true
