spring:
  application:
    name: car-rental
  datasource:
    # LOCK_TIMEOUT: how long a reservation waits for another one of the same car type (ms).
    url: jdbc:h2:mem:carrental;LOCK_TIMEOUT=10000
  jpa:
    hibernate:
      # Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it matches.
      ddl-auto: validate
    open-in-view: false
